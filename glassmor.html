<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Landing Page</title>
    <style>
        /* 1. Global Reset & Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Vibrant pink gradient background to show through the glass */
            background: linear-gradient(135deg, #ff6b6b, #ff007f, #7928ca);
            background-attachment: fixed;
            overflow: hidden;
        }

        /* 2. Decorative Background Blobs (To enhance glass effect) */
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: -1;
            filter: blur(40px);
        }
        .blob-1 { top: -100px; left: -100px; background: #fff; }
        .blob-2 { bottom: -100px; right: -50px; background: #fbff00; }

        /* 3. Main Glass Container */
        .glass-container {
            width: 90%;
            max-width: 1100px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.1); /* Semi-transparent white */
            border-radius: 30px;
            backdrop-filter: blur(20px); /* THE GLASS EFFECT */
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 4. Navigation Bar */
        nav {
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 24px; font-weight: 800; color: white; cursor: pointer; }

        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { text-decoration: none; color: white; font-weight: 500; font-size: 15px; opacity: 0.9; }

        .auth-buttons { display: flex; gap: 15px; }
        .btn { padding: 10px 25px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; }
        .btn-login { background: transparent; color: white; }
        .btn-register { background: white; color: #ff007f; transition: 0.3s; }
        .btn-register:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* 5. Hero Content */
        .content {
            padding: 50px 80px;
            max-width: 600px;
            color: white;
        }

        .content h1 { font-size: 3.5rem; line-height: 1.2; margin-bottom: 20px; }
        .content p { font-size: 16px; line-height: 1.6; opacity: 0.8; margin-bottom: 30px; }

        /* 6. Play Video Button */
        .play-video {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            margin-top: auto;
            align-self: flex-end;
            padding: 0 80px 50px 0;
        }
        .play-icon {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff007f;
            font-size: 20px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .content h1 { font-size: 2.5rem; }
            .glass-container { height: 90vh; }
            nav { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Background Decoration -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="glass-container">
        <!-- Navigation -->
        <nav>
            <div class="logo">LOGO></div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Latest</a></li>
                <li><a href="#">Offers</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="auth-buttons">
                <button class="btn btn-login">Login</button>
                <button class="btn btn-register">Register</button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="content">
            <h1>Learn To Enjoy,<br>Every Moment Of Your Life</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit, laboriosam facere in nam, officiis aspernatur consectetur aliquid sequi possimus et. Sint.</p>
        </div>

        <!-- Video Button -->
        <div class="play-video">
            <span style="color: white; font-weight: 500;">Play Video</span>
            <div class="play-icon">▶</div>
        </div>
    </div>

</body>
</html>
