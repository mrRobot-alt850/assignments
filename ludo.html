<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Ludo Board</title>
    <style>
        :root {
            --red: #ff4d4d;
            --green: #2ecc71;
            --yellow: #f1c40f;
            --blue: #3498db;
            --border: #333;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        /* 15x15 Grid Layout */
        .ludo-board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 600px;
            height: 600px;
            background-color: white;
            border: 5px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Common Cell Styling */
        .cell {
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Home Bases (6x6 squares) */
        .base {
            grid-column: span 6;
            grid-row: span 6;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 30px;
            border: 2px solid var(--border);
        }

        .base-inner {
            background: white;
            grid-column: span 2;
            grid-row: span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            border: 1px solid #999;
        }

        /* Colors */
        .red { background-color: var(--red); }
        .green { background-color: var(--green); }
        .yellow { background-color: var(--yellow); }
        .blue { background-color: var(--blue); }

        /* Tokens */
        .token {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid rgba(0,0,0,0.3);
            margin: auto;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
        }

        /* Center Home (3x3 area) */
        .home-center {
            grid-column: span 3;
            grid-row: span 3;
            background: conic-gradient(
                var(--red) 0deg 90deg, 
                var(--green) 90deg 180deg, 
                var(--yellow) 180deg 270deg, 
                var(--blue) 270deg 360deg
            );
            border: 1px solid var(--border);
        }

        /* Specific Path Highlights */
        .safe-red { background-color: var(--red); }
        .safe-green { background-color: var(--green); }
        .safe-yellow { background-color: var(--yellow); }
        .safe-blue { background-color: var(--blue); }

        /* Positioning the Bases */
        .red-base { grid-area: 1 / 1 / 7 / 7; }
        .green-base { grid-area: 1 / 10 / 7 / 16; }
        .yellow-base { grid-area: 10 / 10 / 16 / 16; }
        .blue-base { grid-area: 10 / 1 / 16 / 7; }

    </style>
</head>
<body>

<div class="ludo-board">
    <!-- RED BASE -->
    <div class="base red red-base">
        <div class="base-inner">
            <div class="token red"></div><div class="token red"></div>
            <div class="token red"></div><div class="token red"></div>
        </div>
    </div>

    <!-- GREEN BASE -->
    <div class="base green green-base">
        <div class="base-inner">
            <div class="token green"></div><div class="token green"></div>
            <div class="token green"></div><div class="token green"></div>
        </div>
    </div>

    <!-- YELLOW BASE -->
    <div class="base yellow yellow-base">
        <div class="base-inner">
            <div class="token yellow"></div><div class="token yellow"></div>
            <div class="token yellow"></div><div class="token yellow"></div>
        </div>
    </div>

    <!-- BLUE BASE -->
    <div class="base blue blue-base">
        <div class="base-inner">
            <div class="token blue"></div><div class="token blue"></div>
            <div class="token blue"></div><div class="token blue"></div>
        </div>
    </div>

    <!-- CENTER -->
    <div class="home-center" style="grid-area: 7 / 7 / 10 / 10;"></div>

    <!-- PATHS (Simplified visualization of colored paths) -->
    <!-- Red Path -->
    <div class="cell safe-red" style="grid-area: 8 / 2 / 9 / 7;"></div>
    <!-- Green Path -->
    <div class="cell safe-green" style="grid-area: 2 / 8 / 7 / 9;"></div>
    <!-- Yellow Path -->
    <div class="cell safe-yellow" style="grid-area: 8 / 10 / 9 / 15;"></div>
    <!-- Blue Path -->
    <div class="cell safe-blue" style="grid-area: 10 / 8 / 15 / 9;"></div>

    <!-- STARTING SQUARES -->
    <div class="cell safe-red" style="grid-area: 7 / 2;"></div>
    <div class="cell safe-green" style="grid-area: 2 / 9;"></div>
    <div class="cell safe-yellow" style="grid-area: 9 / 14;"></div>
    <div class="cell safe-blue" style="grid-area: 14 / 7;"></div>
</div>

</body>
</html>
