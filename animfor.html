<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Form</title>
    <style>
        /* Basic reset and background setup */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #d81b60, #ad1457); /* Pink gradient background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Form container styling */
        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out; /* Entry animation */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 25px;
            font-size: 28px;
            color: #333;
            text-align: left;
            position: relative;
        }

        /* Pink underline for the 'Login' header */
        h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            height: 3px;
            width: 40px;
            background: #d81b60;
        }

        /* Input field styling */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 2px solid #ddd;
            outline: none;
            transition: border-color 0.3s;
            font-size: 16px;
        }

        .input-group input:focus {
            border-bottom: 2px solid #d81b60; /* Highlight on focus */
        }

        /* Primary "Continue" button styling */
        .continue-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #d81b60, #ec407a);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .continue-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.4);
        }

        /* Social media buttons divider */
        .divider {
            margin: 20px 0;
            font-size: 14px;
            color: #777;
        }

        /* Social media button styling */
        .social-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.3s;
        }

        .twitter { background-color: #00acee; }
        .facebook { background-color: #3b5998; }

        .social-btn:hover {
            opacity: 0.85; /* Hover effect */
        }

        .social-btn i {
            margin-right: 10px;
        }
    </style>
    <!-- Font Awesome for social media icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form>
        <div class="input-group">
            <input type="email" placeholder="Enter Your Email" required>
        </div>
        <div class="input-group">
            <input type="password" placeholder="Enter Your Password" required>
        </div>
        <button type="submit" class="continue-btn">Continue</button>
    </form>
    
    <div class="divider">or Connect With Social Media</div>
    
    <button class="social-btn twitter">
        <i class="fab fa-twitter"></i> Sign in With Twitter
    </button>
    <button class="social-btn facebook">
        <i class="fab fa-facebook-f"></i> Sign in With Facebook
    </button>
</div>

</body>
</html>
